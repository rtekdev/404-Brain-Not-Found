services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NEXT_TELEMETRY_DISABLED=1
    # Hot reload: `docker compose up --watch` synchronizuje pliki do kontenera.
    # Bind mount z Windowsa nie przekazuje zdarzeń zmian plików do Turbopacka.
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
            - .next/
            - public/maplibre/
        - action: rebuild
          path: package.json
        - action: rebuild
          path: package-lock.json
