# Jedna komenda: aplikacja (Next.js standalone) + baza PostgreSQL.
#   docker compose up -d --build        → http://localhost:3000
# Baza wczytuje database/*.sql przy pierwszym starcie; od zera: docker compose down -v
services:
  web:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NEXT_TELEMETRY_DISABLED=1
      - DATABASE_URL=postgres://postgres:pass@db:5432/reports
      - WATCHPACK_POLLING=true
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

  db:
    image: postgres:17
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: reports
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reports"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
