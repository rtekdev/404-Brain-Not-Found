services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NEXT_TELEMETRY_DISABLED=1
    # Hot reload: `docker compose up --watch` synchronizuje pliki do kontenera.
    # Bind mount z Windowsa nie przekazuje zdarzeń zmian plików do Turbopacka.
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
            - .next/
            - public/maplibre/
        - action: rebuild
          path: package.json
        - action: rebuild
          path: package-lock.json

  db:
    image: postgres:17
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: reports
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reports"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
